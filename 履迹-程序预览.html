<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>履迹 Trace · 从头到尾的程序预览</title>
<style>
:root{
  --bg:#F6F8FB; --card:#FFFFFF; --line:#E3E8EF; --line2:#D0D8E3;
  --ink:#1F2733; --ink2:#5A6675; --ink3:#8A95A3;
  --blue:#185FA5; --blue-l:#E6F1FB; --blue-d:#0C447C;
  --teal:#0F6E56; --teal-l:#E1F5EE; --teal-d:#085041;
  --amber:#854F0B; --amber-l:#FAEEDA;
  --gray-l:#F1EFE8; --gray:#5F5E5A;
  --red:#A32D2D; --red-l:#FCEBEB;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1240px;margin:0 auto;padding:28px 24px 56px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:38px;height:38px;border-radius:11px;background:var(--blue);position:relative;flex:none}
.mark::before{content:"";position:absolute;left:10px;top:9px;width:2px;height:20px;background:#fff;border-radius:2px}
.mark::after{content:"";position:absolute;left:10px;top:18px;width:17px;height:2px;background:#fff;border-radius:2px}
h1{font-size:19px;font-weight:600;letter-spacing:.2px}
.sub{font-size:12.5px;color:var(--ink2);margin-top:2px}
.tag{display:inline-block;padding:2px 8px;border-radius:5px;background:var(--amber-l);color:var(--amber);font-size:11.5px;font-weight:500;margin-left:8px;vertical-align:2px}
.ctrls{display:flex;gap:8px;align-items:center}
button{font-family:inherit;font-size:13px;cursor:pointer;border-radius:8px;border:1px solid var(--line2);background:#fff;color:var(--ink);padding:8px 14px;transition:.15s}
button:hover{border-color:var(--blue);color:var(--blue)}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button.primary:hover{background:var(--blue-d);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
.layout{display:grid;grid-template-columns:400px 1fr;gap:26px;align-items:start}
@media(max-width:900px){.layout{grid-template-columns:1fr}.phone-shell{margin:0 auto}}
.phone-shell{width:390px;max-width:100%;background:#20262F;border-radius:38px;padding:10px;box-shadow:0 12px 34px rgba(24,39,60,.14);margin:0 auto}
.phone{width:100%;height:726px;background:#fff;border-radius:29px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.status{height:32px;flex:none;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;font-size:11px;color:var(--ink2);font-weight:500}
.status .dots{display:flex;gap:4px;align-items:center}
.status .dots i{width:4px;height:4px;border-radius:50%;background:var(--ink3);display:block}
.appbar{height:50px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#fff}
.appbar b{font-size:15px;font-weight:600;letter-spacing:.3px}
.appbar .rt{font-size:11px;color:var(--ink3)}
.screen{flex:1;overflow-y:auto;padding:16px 16px 22px;background:#FAFBFD;scrollbar-width:thin}
.screen::-webkit-scrollbar{width:5px}
.screen::-webkit-scrollbar-thumb{background:#D8DFE8;border-radius:4px}
.nav{height:56px;flex:none;border-top:1px solid var(--line);background:#fff;display:flex}
.nav div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;color:var(--ink3)}
.nav div.on{color:var(--blue);font-weight:600}
.nav div .ic{width:17px;height:17px;border:1.6px solid currentColor;border-radius:5px;opacity:.8}
.nav div.on .ic{background:var(--blue-l);border-color:var(--blue)}
.notes{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 24px;min-height:520px}
.stepno{font-size:11.5px;color:var(--blue);font-weight:600;letter-spacing:1.2px;text-transform:uppercase}
.notes h2{font-size:19px;font-weight:600;margin:6px 0 10px;line-height:1.4}
.lead{color:var(--ink2);font-size:13.5px;margin-bottom:18px;line-height:1.75}
.sec{border-top:1px solid var(--line);padding-top:15px;margin-top:15px}
.sec h3{font-size:12px;color:var(--ink3);font-weight:600;letter-spacing:.6px;margin-bottom:9px}
.sec ul{list-style:none}
.sec li{position:relative;padding-left:16px;margin-bottom:8px;font-size:13px;color:var(--ink);line-height:1.65}
.sec li::before{content:"";position:absolute;left:2px;top:9px;width:5px;height:5px;border-radius:50%;background:var(--blue)}
.sec li.em::before{background:var(--amber)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-size:11.5px;padding:4px 9px;border-radius:6px;background:var(--blue-l);color:var(--blue-d);border:1px solid #CFE2F7}
.chip.t{background:var(--teal-l);color:var(--teal-d);border-color:#C3E8DB}
.chip.g{background:var(--gray-l);color:var(--gray);border-color:#E0DDD3}
.callout{margin-top:16px;background:var(--amber-l);border-left:3px solid #EF9F27;border-radius:0 8px 8px 0;padding:11px 14px;font-size:12.5px;color:#6B430A;line-height:1.7}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}
.steps button{padding:7px 11px;font-size:12px;border-radius:7px;background:#fff}
.steps button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.steps button.on:hover{color:#fff}
.progress{height:3px;background:var(--line);border-radius:3px;margin-top:18px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--blue);width:10%;transition:width .3s}
/* app ui */
.hero{padding:22px 4px 18px;text-align:center}
.hero .lg{width:56px;height:56px;border-radius:16px;background:var(--blue);margin:0 auto 14px;position:relative}
.hero .lg::before{content:"";position:absolute;left:16px;top:13px;width:2px;height:30px;background:#fff;border-radius:2px}
.hero .lg::after{content:"";position:absolute;left:16px;top:27px;width:25px;height:2px;background:#fff;border-radius:2px}
.hero h2{font-size:21px;font-weight:600;letter-spacing:1px}
.hero p{font-size:12.5px;color:var(--ink2);margin-top:5px}
.hero .badge{display:inline-block;margin-top:14px;font-size:11px;color:var(--teal-d);background:var(--teal-l);border:1px solid #C3E8DB;padding:4px 10px;border-radius:20px}
.blk{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.blk h4{font-size:12.5px;font-weight:600;margin-bottom:9px;display:flex;align-items:center;gap:7px}
.blk h4 .n{width:18px;height:18px;border-radius:6px;background:var(--blue-l);color:var(--blue);font-size:10.5px;display:flex;align-items:center;justify-content:center;flex:none}
.blk p{font-size:12px;color:var(--ink2);line-height:1.7}
.mini{font-size:11px;color:var(--ink3);margin-top:8px;line-height:1.6}
.btn{display:block;width:100%;text-align:center;padding:11px;border-radius:9px;background:var(--blue);color:#fff;font-size:13px;font-weight:500;border:none;cursor:pointer;margin-top:10px}
.btn:hover{background:var(--blue-d)}
.btn.ghost{background:#fff;color:var(--blue);border:1px solid #B9D6F2}
.btn.sm{padding:8px;font-size:12px;margin-top:8px}
.row{display:flex;gap:8px}
.row .btn{flex:1;margin-top:8px}
.upload{border:1.5px dashed #B9D6F2;background:var(--blue-l);border-radius:11px;padding:20px 12px;text-align:center;color:var(--blue-d)}
.upload .ic{width:30px;height:30px;border:2px solid var(--blue);border-radius:9px;margin:0 auto 9px;position:relative}
.upload .ic::after{content:"";position:absolute;left:11px;top:-8px;width:6px;height:12px;border:2px solid var(--blue);border-bottom:none;border-radius:4px 4px 0 0}
.upload b{font-size:13px;display:block}
.upload span{font-size:11px;color:var(--blue);opacity:.85}
.opt{display:flex;align-items:center;gap:9px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;margin-top:8px;background:#fff;font-size:12px}
.opt.on{border-color:var(--blue);background:var(--blue-l)}
.opt .dot{width:13px;height:13px;border-radius:50%;border:1.6px solid var(--line2);flex:none}
.opt.on .dot{border-color:var(--blue);background:var(--blue);box-shadow:inset 0 0 0 3px #fff}
.opt .q{margin-left:auto;font-size:10.5px;color:var(--amber);background:var(--amber-l);padding:2px 6px;border-radius:5px}
.pipe{display:flex;flex-direction:column;gap:7px}
.pstep{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:12px;transition:.25s}
.pstep .k{width:20px;height:20px;border-radius:6px;background:var(--gray-l);color:var(--gray);font-size:10px;display:flex;align-items:center;justify-content:center;flex:none;font-weight:600}
.pstep .tx{flex:1}
.pstep .tx b{font-weight:600;display:block}
.pstep .tx span{font-size:10.5px;color:var(--ink3)}
.pstep .st{font-size:10.5px;color:var(--ink3);flex:none}
.pstep.done{border-color:#BFE5D6;background:var(--teal-l)}
.pstep.done .k{background:var(--teal);color:#fff}
.pstep.done .st{color:var(--teal-d);font-weight:600}
.pstep.active{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue-l)}
.pstep.active .k{background:var(--blue);color:#fff}
.tlhead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.tlhead b{font-size:14px}
.tlhead span{font-size:10.5px;color:var(--ink3)}
.group{font-size:10.5px;color:var(--ink3);letter-spacing:.5px;margin:12px 0 7px;display:flex;align-items:center;gap:7px}
.group::after{content:"";flex:1;height:1px;background:var(--line)}
.ev{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:7px;position:relative;cursor:pointer;transition:.15s}
.ev:hover{border-color:var(--blue);transform:translateY(-1px)}
.ev.live{border-color:#7FC8AC;background:#F4FCF9}
.ev.fallback{border-color:#E2C9A0;background:#FFFCF6}
.ev .d{font-size:10.5px;color:var(--ink3);font-weight:600;letter-spacing:.3px}
.ev .t{font-size:12.5px;font-weight:600;margin:2px 0 5px}
.ev .q{font-size:11.5px;color:var(--ink2);line-height:1.55}
.ev .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.ev .tagx{font-size:10px;padding:2px 6px;border-radius:4px;background:var(--gray-l);color:var(--gray)}
.ev .tagx.b{background:var(--blue-l);color:var(--blue-d)}
.ev .tagx.g{background:var(--teal-l);color:var(--teal-d)}
.ev .tagx.a{background:var(--amber-l);color:var(--amber)}
.ev .corner{position:absolute;right:9px;top:9px;font-size:9.5px;padding:2px 6px;border-radius:4px;background:var(--gray-l);color:var(--gray)}
.ev.live .corner{background:var(--teal);color:#fff}
.ev.fallback .corner{background:#EFD9B4;color:#7A5212}
.detail{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:11px}
.detail .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
.detail .hd b{font-size:14px}
.kv{display:grid;grid-template-columns:74px 1fr;gap:6px 8px;font-size:11.5px;padding:9px 0;border-top:1px solid var(--line)}
.kv dt{color:var(--ink3)}
.kv dd{color:var(--ink);word-break:break-all}
.quote{background:var(--blue-l);border-left:3px solid var(--blue);border-radius:0 8px 8px 0;padding:10px 12px;margin:10px 0;font-size:12.5px;color:var(--blue-d);line-height:1.7}
.player{display:flex;align-items:center;gap:9px;background:#F3F6FA;border-radius:9px;padding:9px 11px;margin:10px 0}
.player .play{width:26px;height:26px;border-radius:50%;background:var(--blue);flex:none;position:relative}
.player .play::after{content:"";position:absolute;left:10px;top:8px;border-left:7px solid #fff;border-top:5px solid transparent;border-bottom:5px solid transparent}
.player .wave{flex:1;height:16px;display:flex;align-items:center;gap:2px}
.player .wave i{flex:1;background:#B9D6F2;border-radius:2px;height:40%}
.player .wave i:nth-child(3n){height:85%}
.player .wave i:nth-child(4n){height:60%}
.player .wave i:nth-child(5n){height:100%}
.player .tm{font-size:10.5px;color:var(--ink3);flex:none}
.qbtn{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:9px;padding:10px 11px;margin-bottom:7px;font-size:12px;cursor:pointer;color:var(--ink)}
.qbtn:hover{border-color:var(--blue)}
.qbtn.on{background:var(--blue-l);border-color:var(--blue);color:var(--blue-d);font-weight:600}
.ans{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:9px;font-size:12px;line-height:1.75}
.ans .lbl{font-size:10.5px;color:var(--teal-d);font-weight:600;margin-bottom:6px;display:block}
.ans .src{margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);font-size:10.5px;color:var(--ink3)}
.redline{background:var(--red-l);border:1px solid #F3D2D2;border-radius:9px;padding:9px 11px;font-size:11px;color:var(--red);line-height:1.6;margin-top:10px}
.diff{display:flex;gap:8px;margin-top:9px}
.diff div{flex:1;border:1px solid var(--line);border-radius:8px;padding:9px;font-size:11px;background:#fff}
.diff div.b{background:var(--teal-l);border-color:#BFE5D6}
.diff .h{font-size:10px;color:var(--ink3);margin-bottom:5px;font-weight:600}
.lock{background:var(--teal-l);border:1px solid #BFE5D6;border-radius:9px;padding:10px 11px;font-size:11.5px;color:var(--teal-d);line-height:1.65;margin-top:10px}
.field{margin-bottom:10px}
.field label{display:block;font-size:11px;color:var(--ink2);margin-bottom:4px}
.field input{width:100%;border:1px solid var(--line2);border-radius:8px;padding:9px 10px;font-size:12px;font-family:inherit;color:var(--ink);background:#fff}
.field input::placeholder{color:var(--ink3)}
.spec h4{font-size:12px;font-weight:600;color:var(--blue-d);margin:14px 0 7px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.spec h4:first-child{margin-top:0}
.spec .li{font-size:11.5px;color:var(--ink2);line-height:1.75;padding-left:12px;position:relative}
.spec .li::before{content:"";position:absolute;left:2px;top:9px;width:4px;height:4px;background:var(--blue);border-radius:50%}
.spec .li b{color:var(--ink);font-weight:600}
.flowline{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:10.5px;color:var(--ink2);margin-top:8px}
.flowline span{background:var(--blue-l);color:var(--blue-d);padding:3px 7px;border-radius:5px}
.flowline i{color:var(--ink3);font-style:normal}
.foot{margin-top:22px;font-size:11.5px;color:var(--ink3);line-height:1.8;text-align:center}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand">
    <div class="mark"></div>
    <div>
      <h1>履迹 Trace · 从头到尾的程序预览<span class="tag">设计预览 · 非最终交付物</span></h1>
      <div class="sub">装完打开到 ima 拓展，把整条链路按真实交互走一遍 · 示例数据仅用于预览</div>
    </div>
  </div>
  <div class="ctrls">
    <button id="autoBtn" class="primary">▶ 从头播放全流程</button>
    <button id="resetBtn">重置</button>
  </div>
</header>

<div class="layout">
  <div class="phone-shell">
    <div class="phone">
      <div class="status"><span>9:41</span><span class="dots"><i></i><i></i><i></i></span></div>
      <div class="appbar"><b id="appTitle">履迹</b><span class="rt" id="appRt">本地</span></div>
      <div class="screen" id="screen"></div>
      <div class="nav">
        <div class="on"><span class="ic"></span>时间轴</div>
        <div><span class="ic"></span>复盘</div>
        <div><span class="ic"></span>我的</div>
      </div>
    </div>
  </div>

  <div class="notes" id="notes"></div>
</div>

<div class="steps" id="steps"></div>
<div class="progress"><i id="bar"></i></div>
<div class="foot">预览数据为示例，正式版需由你本人照 9 句念成真实音频生成 L2 与证据戳 · 「全自动」入口待今晚 8–12h 录音实测后定 · Q1 保持开放</div>
</div>

function evCard(e,i,kind){
  const cls = kind || '';
  const corner = kind==='live' ? '现场实时新增' : kind==='fallback' ? '离线演示数据' : '赛前彩排 · 真实录音';
  return `<div class="ev ${cls}" onclick="openDetail(${i})">
    <div class="corner">${corner}</div>
    <div class="d">${e.d} · ${e.type}</div>
    <div class="t">${e.t}</div>
    <div class="q">「${e.q}」</div>
    <div class="tags"><span class="tagx b">${e.emo}</span><span class="tagx">source=user</span><span class="tagx g">confirmed</span></div>

}

function timelineHTML(){
  let h = `<div class="tlhead"><b>我的一学期</b><span>9 张 · 按事件日</span></div>`;

      <div class="li">不自建知识库 · 不爬 APP 相册 · 不做阶段二的多源融合</div>
      <h4>D · 任务顺序</h4>
      <div class="li">T01 骨架 → T02 音频 ∥ T03 存储 → T04 抽取复盘 → T05 联调降级演练</div>
      <h4>E · 仍未定</h4>
      <div class="li"><b>Q1 全自动</b>：等今晚 8–12h 录音实测，入口保持可插拔</div>
      <div class="li"><b>凭证</b>：建议单独申请比赛专用 key + 额度上限 + 赛后吊销</div>
    </div>`;
  }

  screen.innerHTML = h;
  screen.scrollTop = 0;
  renderNotes();
  renderSteps();
}

function renderNotes(){
  const s = STEPS[cur];
  let h = `<div class="stepno">STEP ${String(cur+1).padStart(2,'0')} / ${STEPS.length} · ${s.tab}</div><h2>${s.title}</h2><div class="lead">${s.lead}</div>`;
  if(s.points.length){
    h += `<div class="sec"><h3>这一步在做什么 / 对应哪个决定</h3><ul>`;
    s.points.forEach(p=> h += `<li>${p}</li>`);
    h += `</ul></div>`;
  }
  if(s.tech.length){
    h += `<div class="sec"><h3>技术点</h3><div class="chips">`;
    s.tech.forEach((t,i)=> h += `<span class="chip ${i%3===1?'t':i%3===2?'g':''}">${t}</span>`);
    h += `</div></div>`;
  }
  if(s.callout) h += `<div class="callout">${s.callout}</div>`;
  notes.innerHTML = h;
}

function renderSteps(){
  let h = '';
  STEPS.forEach((s,i)=> h += `<button class="${i===cur?'on':''}" onclick="go(${i})">${i+1}. ${s.tab}</button>`);
  document.getElementById('steps').innerHTML = h;
  document.getElementById('bar').style.width = ((cur+1)/STEPS.length*100)+'%';
}

function go(i){ cur=i; qaOpen=-1; pipeStage = i===2?pipeStage:-1; render(); }
function setInput(v){ chosenInput=v; render(); }
function nextPipe(){ pipeStage=Math.min(pipeStage+1,5); render(); }
function finishPipe(){ pipeStage=5; go(3); }
function openDetail(i){ if(i>=0){ go(4); } }
function toggleQA(i){ qaOpen = qaOpen===i?-1:i; render(); }
function doCorrect(){ corrected=true; render(); }
function addLive(){ liveAdded=true; render(); }
function addFallback(){ fallbackAdded=true; render(); }

const autoBtn = document.getElementById('autoBtn');
autoBtn.onclick = ()=>{
  if(timer){ stopAuto(); return; }
  cur=0; corrected=false; liveAdded=false; fallbackAdded=false; qaOpen=1; pipeStage=5; render();
  autoBtn.textContent='❚❚ 暂停播放';
  timer = setInterval(()=>{
    if(cur>=STEPS.length-1){ stopAuto(); return; }
    cur++;
    if(STEPS[cur].id==='detail') corrected=false;
    if(STEPS[cur].id==='live'){ liveAdded=true; fallbackAdded=true; }
    if(STEPS[cur].id==='review') qaOpen=0;
    render();
  }, 2600);
};
function stopAuto(){ if(timer) clearInterval(timer); timer=null; autoBtn.textContent='▶ 从头播放全流程'; }
document.getElementById('resetBtn').onclick = ()=>{
  stopAuto(); cur=0; qaOpen=-1; corrected=false; liveAdded=false; fallbackAdded=false; pipeStage=-1; chosenInput='import'; render();
};

render();
</script>
</body>
</html>
